# slim home-lab monitoring (2026-10-17)
global:
  scrape_interval: 30s
  evaluation_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']

  - job_name: node
    static_configs:
      - targets: ['127.0.0.1:9100']
        labels: {instance: slim}

  - job_name: pihole
    static_configs:
      - targets: ['127.0.0.1:9617']

  - job_name: blackbox_exporter
    static_configs:
      - targets: ['127.0.0.1:9115']

  # Reachability: gateway, ASUS AP, internet
  - job_name: ping
    metrics_path: /probe
    params: {module: [icmp]}
    static_configs:
      - targets: ['192.0.2.1', '192.0.2.20', '1.1.1.1']
    relabel_configs: &bb
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: 127.0.0.1:9115

  # Services: ASUS SSH (telemetry path), gateway web, Pi-hole web
  - job_name: tcp
    metrics_path: /probe
    params: {module: [tcp_connect]}
    static_configs:
      - targets: ['192.0.2.20:22', '192.0.2.1:80', '192.0.2.10:80']
    relabel_configs: *bb

  # Pi-hole answers DNS on the LAN address
  - job_name: dns_pihole
    metrics_path: /probe
    params: {module: [dns_pihole]}
    static_configs:
      - targets: ['192.0.2.10']
    relabel_configs: *bb

  # Internet via HTTPS
  - job_name: http
    metrics_path: /probe
    params: {module: [http_2xx]}
    static_configs:
      - targets: ['https://www.google.com', 'https://archive.ubuntu.com']
    relabel_configs: *bb

  - job_name: router
    static_configs:
      - targets: ['127.0.0.1:9618']
        labels: {instance: asus-rt-ax56u}

  # Unbound recursive resolver (Pi-hole's only upstream), loopback only
  - job_name: dns_unbound
    metrics_path: /probe
    params: {module: [dns_unbound]}
    static_configs:
      - targets: ['127.0.0.1:5335']
    relabel_configs: *bb
