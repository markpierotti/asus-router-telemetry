modules:
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: ip4
  tcp_connect:
    prober: tcp
    timeout: 5s
  http_2xx:
    prober: http
    timeout: 10s
    http:
      preferred_ip_protocol: ip4
  dns_pihole:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: udp
      query_name: google.com
      query_type: A
      valid_rcodes: [NOERROR]
