# Sandbox for the Hermes gateway (system service, User=hermes, installed with
# `hermes gateway install --system --run-as-user hermes`). The account is already
# unprivileged with no sudo; this confines what a misled agent could touch.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=tmpfs
BindPaths=/home/hermes
ReadWritePaths=/home/hermes -/run/user/1001
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictSUIDSGID=yes
RestrictRealtime=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
CapabilityBoundingSet=
UMask=0077
