# Receive the ASUS access point's syslog over UDP 514 and keep it in its own file.
# Only the ASUS address is accepted (here, and again in ufw). Nothing else is
# received remotely, and remote lines never reach /var/log/syslog.
module(load="imudp")
$AllowedSender UDP, 192.0.2.20

# The ASUS clock can be wrong before NTP syncs, so stamp lines on arrival.
template(name="asusLine" type="string"
         string="%timegenerated:::date-rfc3339% %syslogtag%%msg:::sp-if-no-1st-sp%%msg:::drop-last-lf%\n")

ruleset(name="asus") {
    if $fromhost-ip == '192.0.2.20' then {
        action(type="omfile" file="/var/log/asus/asus.log" template="asusLine"
               fileCreateMode="0640" dirCreateMode="0750" fileOwner="syslog" fileGroup="adm")
    }
    stop
}

input(type="imudp" address="192.0.2.10" port="514" ruleset="asus")
