# Unbound: recursive, DNSSEC-validating resolver for Pi-hole on slim (2026-10-18).
# Loopback only; Pi-hole's sole upstream is 127.0.0.1#5335. DNSSEC trust anchor
# comes from the package's root-auto-trust-anchor-file.conf.
server:
    verbosity: 0
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    # slim has no IPv6 upstream
    do-ip6: no
    prefer-ip6: no
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    prefetch: yes
    qname-minimisation: yes
    hide-identity: yes
    hide-version: yes
    num-threads: 1
    msg-cache-size: 64m
    rrset-cache-size: 128m
    # never accept private addresses in public answers (DNS rebinding)
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
